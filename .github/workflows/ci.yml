name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC; no repository write permission or upload secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personai_test
          POSTGRES_USER: personai
          POSTGRES_PASSWORD: personai_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personai -d personai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://personai:personai_test_only@127.0.0.1:5432/personai_test
      PERSONAI_TEST_POSTGRES_URL: postgresql://personai:personai_test_only@127.0.0.1:5432/personai_test
      AUTH_ISSUER: http://127.0.0.1:3000
      AUTH_AUDIENCE: personai-api
      AUTH_JWKS_URL: http://127.0.0.1:3000/api/auth/jwks
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install hatch
      - run: hatch run lint
      - run: hatch run types:check
      - name: Tests and coverage
        id: tests
        run: hatch run test-cov --junitxml=test-results/junit.xml -o junit_family=legacy
      - run: hatch run alembic upgrade head
      - run: hatch run alembic check
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && hashFiles('coverage.xml') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage.xml
          disable_search: true
          plugins: noop
          report_type: coverage
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && hashFiles('test-results/junit.xml') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./test-results/junit.xml
          disable_search: true
          plugins: noop
          report_type: test_results
          fail_ci_if_error: false
