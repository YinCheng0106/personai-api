[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personai-api"
dynamic = ["version"]
description = "AI Smart Fitness Coach Backend API"
readme = "README.md"

requires-python = ">=3.11" # 支援的 Python 版本
license = "MIT" 
keywords = ["fastapi", "ai", "fitness", "biomechanics"]
authors = [
  { name = "YinCheng0106", email = "eason010630@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = [
  "fastapi[standard]>=0.110.0",          # 後端 API 框架
  "websockets>=12.0",          # 處理前端即時 keypoints 串流通訊
  "numpy>=1.26.4",             # 幾何角度與矩陣運算
  "pandas>=2.2.1",             # InBody 數據與運動紀錄處理
  "sqlalchemy>=2.0.36",        # PostgreSQL / SQLite ORM 與持久化
  "psycopg[binary]>=3.2.0",    # PostgreSQL driver
  "python-dotenv>=1.0.1",      # 載入本機未提交的 .env 設定
  "PyJWT[crypto]>=2.10.1",     # 驗證 Better Auth JWKS JWT
  "alembic>=1.16.0",           # 資料庫 migration
]

[tool.hatch.envs.default]
dependencies = [
  "httpx>=0.28.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.hatch.envs.default.scripts]
format = "ruff format {args:src tests}"
lint = "ruff check {args:src tests}"
test = "pytest {args:tests}"
test-cov = "pytest --cov=personai_api --cov-report=term-missing --cov-fail-under=70 {args:tests}"
benchmark-ws = "python scripts/ws_benchmark.py {args}"

[project.urls]
Documentation = "https://github.com/YinCheng0106/personai-api#readme"
Issues = "https://github.com/YinCheng0106/personai-api/issues"
Source = "https://github.com/YinCheng0106/personai-api"

[tool.hatch.version]
path = "src/personai_api/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/personai_api tests}"

[tool.coverage.run]
source = ["src/personai_api", "tests"]
branch = true
parallel = true
omit = [
  "src/personai_api/__about__.py",
]

[tool.coverage.paths]
personai-api = ["src/personai_api", "*/personai-api/src/personai_api"]
tests = ["tests", "*/personai-api/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.fastapi]
entrypoint = "personai_api.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
